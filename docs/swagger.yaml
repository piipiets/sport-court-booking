basePath: /
definitions:
  common.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  request.CreateBookingRequest:
    properties:
      booking_date:
        type: string
      court_id:
        type: integer
      end_time:
        type: string
      start_time:
        type: string
    required:
    - booking_date
    - court_id
    - end_time
    - start_time
    type: object
  request.CreatePaymentRequest:
    properties:
      amount:
        type: number
      booking_id:
        type: integer
      method:
        enum:
        - cash
        - transfer
        - qris
        type: string
    required:
    - amount
    - booking_id
    - method
    type: object
  request.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  request.SignUpRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      re_type_password:
        type: string
    required:
    - email
    - name
    - password
    - re_type_password
    type: object
  request.UpdateBookingStatusRequest:
    properties:
      status:
        enum:
        - confirmed
        - cancelled
        - completed
        type: string
    required:
    - status
    type: object
  response.BookingResponse:
    properties:
      booking_date:
        type: string
      court_id:
        type: integer
      created_at:
        type: string
      end_time:
        type: string
      id:
        type: integer
      payment_deadline:
        type: string
      start_time:
        type: string
      status:
        type: string
      total_price:
        type: number
    type: object
  response.CourtResponse:
    properties:
      id:
        type: integer
      image_url:
        type: string
      location:
        type: string
      name:
        type: string
      price_per_hour:
        type: number
      type:
        type: string
    type: object
  response.LoginResponse:
    properties:
      expired_at:
        type: string
      token:
        type: string
    type: object
  response.PaymentResponse:
    properties:
      amount:
        type: number
      booking_id:
        type: integer
      id:
        type: integer
      method:
        type: string
      paid_at:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for managing sport courts, bookings, and payments.
  title: Sport Court Booking API
  version: 1.0.0
paths:
  /api/bookings:
    get:
      description: Retrieve all bookings associated with the logged-in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.BookingResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all bookings for the logged-in user
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      description: Create a booking for the authenticated user
      parameters:
      - description: Booking payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a new booking
      tags:
      - Bookings
  /api/bookings/{id}:
    get:
      description: Retrieve a specific booking by its ID
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.BookingResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get a booking by ID
      tags:
      - Bookings
  /api/bookings/status/{id}:
    put:
      consumes:
      - application/json
      description: Update a booking status (admin only)
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateBookingStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Update booking status
      tags:
      - Bookings
  /api/courts:
    get:
      description: Fetch all sport courts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.CourtResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all courts
      tags:
      - Courts
    post:
      consumes:
      - multipart/form-data
      description: Create a new court (admin only)
      parameters:
      - description: Court name
        in: formData
        name: name
        required: true
        type: string
      - description: Court type (futsal or badminton)
        in: formData
        name: type
        required: true
        type: string
      - description: Price per hour
        in: formData
        name: price_per_hour
        required: true
        type: number
      - description: Court location
        in: formData
        name: location
        required: true
        type: string
      - description: Court image (jpg/jpeg/png/webp, max 5MB)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a court
      tags:
      - Courts
  /api/courts/{id}:
    delete:
      description: Delete a court by ID (admin only)
      parameters:
      - description: Court ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a court
      tags:
      - Courts
    get:
      description: Fetch a single court by its ID
      parameters:
      - description: Court ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.CourtResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get a court by ID
      tags:
      - Courts
    put:
      consumes:
      - multipart/form-data
      description: Update a court (admin only)
      parameters:
      - description: Court ID
        in: path
        name: id
        required: true
        type: integer
      - description: Court name
        in: formData
        name: name
        type: string
      - description: Court type (futsal or badminton)
        in: formData
        name: type
        type: string
      - description: Price per hour
        in: formData
        name: price_per_hour
        type: number
      - description: Court location
        in: formData
        name: location
        type: string
      - description: New court image
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Update a court
      tags:
      - Courts
  /api/courts/{id}/image:
    get:
      description: Stream the court image bytes
      parameters:
      - description: Court ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get court image
      tags:
      - Courts
  /api/payments:
    get:
      description: Retrieve all payments for the authenticated user (admins see all)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.PaymentResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all payments for the logged-in user
      tags:
      - Payments
    post:
      consumes:
      - application/json
      description: Record a payment for the authenticated user's booking
      parameters:
      - description: Payment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Record a payment
      tags:
      - Payments
  /api/payments/{booking_id}:
    get:
      description: Retrieve the payment for a specific booking (owner or admin)
      parameters:
      - description: Booking ID
        in: path
        name: booking_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.PaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/common.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get payment by booking ID
      tags:
      - Payments
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT access token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.APIResponse'
      summary: User login
      tags:
      - Auth
  /sign-up:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Sign up payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.APIResponse'
      summary: User sign up
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
